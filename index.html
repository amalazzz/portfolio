<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio 2022</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
    --bg-color: #efefef;
    --text-color: #1a1a1a;
    --pink-aura: rgba(255, 140, 180, 0.5);
    --pink: #ff8cb4;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-color);
    font-family: 'Inter', sans-serif;
    color: var(--text-color);
    overflow-x: hidden;
    scroll-behavior: smooth; /* smooth scroll pour la flèche */
}

/* Effet de grain */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.15;
    pointer-events: none;
    z-index: 10;
}

/* Aura rose floue animée */
.aura {
    position: absolute;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, var(--pink-aura) 0%, rgba(239,239,239,0) 70%);
    right: -10%;
    top: 50%;
    transform: translateY(-50%);
    filter: blur(80px);
    z-index: 1;
    animation: auraMove 6s ease-in-out infinite alternate;
}

@keyframes auraMove {
    0% { transform: translateY(-50%) translateX(0) scale(1); }
    50% { transform: translateY(-55%) translateX(10px) scale(1.05); }
    100% { transform: translateY(-50%) translateX(-10px) scale(1); }
}

/* Conteneur principal */
.container {
    text-align: center;
    z-index: 5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: fadeIn 1.5s ease-out;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 15vw, 10rem);
    font-weight: 450;
    letter-spacing: -0.03em;
    margin-bottom: 0.5em;
}

.nav-links {
    display: flex;
    justify-content: center;
    gap: 15px;
    font-size: 14px;
}

.pill {
    padding: 8px 24px;
    border: 1px solid rgba(0,0,0,0.4);
    border-radius: 50px;
    text-decoration: none;
    color: var(--text-color);
    transition: all 0.3s ease;
    background: transparent;
    pointer-events: none; /* non cliquable */
}

.pill:hover {
    background-color: var(--text-color);
    color: white;
    border-color: var(--text-color);
}

.pill.active {
    pointer-events: auto; /* bouton cliquable */
    border-color: var(--pink);
    color: var(--pink);
}

.pill.active:hover {
    background-color: var(--pink);
    color: white;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Flèche vers le site */
.scroll-down {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    color: var(--pink);
    cursor: pointer;
    animation: bounce 2s infinite;
    z-index: 5;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
    40% { transform: translateX(-50%) translateY(-10px); }
    60% { transform: translateX(-50%) translateY(-5px); }
}

/* Section cible du site (exemple) */
#site-section {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    background-color: #fff;
    color: #1a1a1a;
}
</style>
</head>
<body>

<div class="aura"></div>

<div class="container">
    <h1>Portfolio</h1>
    <div class="nav-links">
        <a href="#" class="pill">2022</a>
        <a href="#" class="pill">Curriculum Vitae</a>
    </div>
</div>

<!-- Flèche cliquable -->
<div class="scroll-down" onclick="document.getElementById('site-section').scrollIntoView({behavior:'smooth'});">
    ↓
</div>

<!-- Section du site vers laquelle la flèche scroll -->
<div id="site-section">
    Bienvenue sur le site !
</div>

</body>
</html>
