<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio – Amal Azizi</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --pink: #fcfdff;
            --pink-aura: rgba(72, 57, 133, 0.4);
            --transition: all 0.4s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Effet de grain */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15;
            pointer-events: none;
            z-index: 1000;
        }

        /* Aura rose fixe */
        .aura {
            position: fixed;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, var(--pink-aura) 0%, transparent 70%);
            right: -15%; top: -10%;
            filter: blur(80px);
            z-index: 0;
        }

        /* Navbar Directe */
        .navbar {
            position: fixed;
            top: 0; width: 100%;
            padding: 30px 5%;
            z-index: 101;
            display: flex;
            justify-content: flex-end;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(10px);
        }

        .nav-links ul { display: flex; list-style: none; gap: 30px; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0.5;
            transition: var(--transition);
        }
        .nav-links a.active, .nav-links a:hover { opacity: 1; }

        /* Main Container */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 5;
            padding: 0 5%;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 15vw, 9rem);
            font-weight: 450;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            line-height: 1;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 500px;
            opacity: 0.6;
            margin-bottom: 40px;
        }

        .intro-pills { display: flex; gap: 15px; }

        .pill {
            padding: 10px 28px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 50px;
            text-decoration: none;
            color: inherit;
            font-size: 14px;
            transition: var(--transition);
        }

        .pill:hover {
            border-color: var(--text-color);
            background: var(--text-color);
            color: rgba(255, 255, 255, 0);
        }

        .pill.active {
            border-color: var(--pink);
            color: var(--pink);
        }

        footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            opacity: 0.3;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
        }

    </style>
</head>
<body>

    <div class="aura"></div>

    <header class="navbar">
        <nav class="nav-links">
            <ul>
                <li><a href="accueil_folio.html" >Accueil</a></li>
                <li><a href="projets2.html">Projets</a></li>
                <li><a href="apropos.html">À propos</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <h1>Portfolio</h1>
        <p>Amal Azizi - A la recherche d'un stage en audiovisuelle, communication, directrice artistique ou design !</p>
        
        <div class="intro-pills">
            <a href="accueil_folio.html" class="pill active">Découvrir</a>
            <a href="CV_Amal_Azizi.pdf" target="_blank" class="pill">Mon CV</a>
        </div>
    </main>

    <footer>
        © 2025 Amal AZIZI — Tous droits réservés
    </footer>

</body>
</html>
